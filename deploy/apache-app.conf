# Apache virtual host for app.nbsvworldwide.com
# - serves the built frontend (agro-web/dist)
# - reverse-proxies /api and /storage to the Node backend (agro-api on 127.0.0.1:3002)
#
# Enable required modules first:
#   sudo a2enmod proxy proxy_http rewrite headers
# Install:
#   sudo cp deploy/apache-app.conf /etc/apache2/sites-available/agro-app.conf
#   sudo a2ensite agro-app
#   sudo a2dissite 000-default        # optional: drop the default site
#   sudo apache2ctl configtest && sudo systemctl reload apache2
# Then add HTTPS:
#   sudo apt install -y certbot python3-certbot-apache
#   sudo certbot --apache -d app.nbsvworldwide.com

<VirtualHost *:80>
    ServerName app.nbsvworldwide.com
    DocumentRoot /var/www/agro-web/dist

    # Reverse proxy API + uploads to the Node backend.
    ProxyPreserveHost On
    ProxyPass        /api     http://127.0.0.1:3002/api
    ProxyPassReverse /api     http://127.0.0.1:3002/api
    ProxyPass        /storage http://127.0.0.1:3002/storage
    ProxyPassReverse /storage http://127.0.0.1:3002/storage
    ProxyPass        /health  http://127.0.0.1:3002/health

    <Directory /var/www/agro-web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # SPA fallback: serve index.html for client-side routes.
        FallbackResource /index.html
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/agro-app-error.log
    CustomLog ${APACHE_LOG_DIR}/agro-app-access.log combined
</VirtualHost>
