# nginx server block for app.nbsvworldwide.com
# - serves the built frontend (agro-web/dist)
# - proxies /api and /storage to the Node backend (agro-api on 127.0.0.1:3002)
#
# Install:
#   sudo cp deploy/nginx-app.conf /etc/nginx/sites-available/agro-app
#   sudo ln -s /etc/nginx/sites-available/agro-app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot to add HTTPS (see DEPLOY.md).

server {
    listen 80;
    listen [::]:80;
    server_name app.nbsvworldwide.com;

    # Built frontend
    root /var/www/agro-web/dist;
    index index.html;

    # Max upload size (API accepts up to ~10MB)
    client_max_body_size 12m;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (proofs, photos) served by the backend
    location /storage/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
    }

    # Health check (optional)
    location = /health {
        proxy_pass http://127.0.0.1:3002;
    }

    # SPA fallback — every other path returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
